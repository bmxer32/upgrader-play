<!DOCTYPE html>
<html lang="ru">
<head>
  <!-- Подменяется значением --base-href при сборке. Игра живёт
       не в корне домена, а на /play/: корень занят лендингом. -->
  <base href="/play/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="description" content="Симулятор апгрейда скинов CS2. Крути апгрейды, вызывай на дуэли, поднимайся в таблице лидеров — прямо в браузере, без установки.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Upgrader">
  <meta name="theme-color" content="#0B0E14">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Два фавикона, и это не перестраховка. PNG видят современные
       браузеры, .ico спрашивают старые и Windows для ярлыка на рабочем
       столе. Композиция у них своя, плотнее иконки приложения: во
       вкладке шестнадцать точек, и поля, которые красят иконку на
       телефоне, съедают на таком размере весь логотип. -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>
  <link rel="icon" href="favicon.ico" sizes="any"/>

  <title>Upgrader — апгрейд скинов CS2 в браузере</title>
  <link rel="manifest" href="manifest.json">

  <!-- Очередь рекламы РСЯ.
       Объявлена здесь, до всего: в неё можно складывать показы ещё
       до того, как приедет сам скрипт сети. Сам скрипт подключается
       не тут — см. ниже, после первого кадра игры. -->
  <script>window.yaContextCb = window.yaContextCb || []</script>

  <style>
    /* Экран загрузки.
       Движок Flutter весит несколько мегабайт, и без этой заставки
       человек с телефона первые секунды смотрит в белый лист и уходит.
       Всё нарисовано разметкой и стилями — ни одного лишнего запроса,
       и видно оно раньше, чем начнёт грузиться сам движок. */
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #0B0E14;
      overscroll-behavior: none;
    }
    #boot {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      background: radial-gradient(120% 90% at 50% 15%, #131A26 0%, #0B0E14 70%);
      font: 600 13px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #8A99AD; letter-spacing: 3px; text-transform: uppercase;
      /* Убираем не мгновенно: резкая подмена картинки читается как рывок */
      transition: opacity .35s ease;
    }
    #boot.done { opacity: 0; pointer-events: none; }
    #boot svg { width: 96px; height: 96px; }

    /* Шеврон дышит — признак, что процесс идёт, а не завис */
    #boot svg .up { animation: rise 1.6s ease-in-out infinite; }
    #boot svg .up.second { animation-delay: .18s; }
    @keyframes rise {
      0%, 100% { transform: translateY(0); opacity: 1; }
      50%      { transform: translateY(-14px); opacity: .55; }
    }

    #bar { width: 148px; height: 3px; border-radius: 2px; background: #273347; overflow: hidden; }
    #bar i { display: block; width: 40%; height: 100%; border-radius: 2px;
             background: linear-gradient(90deg, #cc9900, #ffe833);
             animation: slide 1.25s ease-in-out infinite; }
    @keyframes slide {
      0%   { transform: translateX(-110%); }
      100% { transform: translateX(360%); }
    }

    /* Тем, кто просил не анимировать, — не анимируем */
    @media (prefers-reduced-motion: reduce) {
      #boot svg .up, #bar i { animation: none; }
      #bar i { width: 100%; }
    }

    /* Видео не должно ловить нажатия.
       Игра рисуется одним холстом, а видео проигрывается настоящим
       элементом страницы поверх него. Такой элемент забирает нажатия
       себе, и до игры они не доходят: в окне награды за рекламу
       переставали работать и сам кейс, и панель вкладок под видео —
       ровно там, где оно лежит.
       Взаимодействия видео не требует: оно без управления и служит
       картинкой. Правило узкое, только для вставок вроде него, —
       на случай, если однажды появится вставка, с которой надо
       будет работать мышью. */
    flt-platform-view, flt-platform-view * { pointer-events: none; }
  </style>
</head>
<body>
  <div id="boot">
    <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path class="up" d="M 256 130 L 384 226 L 384 277 L 256 181 L 128 277 L 128 226 Z" fill="#ffe833"/>
      <path class="up second" d="M 256 235 L 384 331 L 384 382 L 256 286 L 128 382 L 128 331 Z" fill="#cc9900"/>
    </svg>
    <div>Upgrader</div>
    <div id="bar"><i></i></div>
  </div>

  <script>
    // Выгоняем прежний служебный поток.
    //
    // Сборка больше его не ставит: игра всё равно бесполезна без
    // сервера, а офлайновый кэш означал, что человек открывает вчерашнюю
    // версию и видит уже исправленные ошибки. Отлаживать это невозможно:
    // на вопрос «обновил?» честный ответ «да», а на экране старое.
    //
    // У тех, кто уже заходил, поток остался зарегистрированным, и снять
    // его может только страница. Отсюда эти четыре строки — они нужны
    // ровно один раз на каждого игрока.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then(function (list) { list.forEach(function (r) { r.unregister(); }); })
        .catch(function () {});
    }

    // Событие шлёт сам движок, когда отрисовал первый кадр. Снимать
    // заставку по таймеру нельзя: на медленном телефоне она ушла бы
    // раньше игры и оставила тот самый белый экран, ради которого
    // всё и затевалось.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (boot) {
        boot.classList.add('done');
        setTimeout(function () { boot.remove(); }, 400);
      }

      // Реклама подключается здесь, а не в head, и это не косметика.
      //
      // В head со своим async она соревновалась за канал с самой игрой,
      // а та весит мегабайты. Замерено в браузере: скрипт сети ехал
      // 86 секунд. Игрок за это время успевал нажать кейс и получить
      // «реклама готовится» — показывать было нечем.
      //
      // После первого кадра канал свободен, игра уже на экране,
      // а до кнопки кейса человек доберётся заведомо позже, чем
      // доедут эти сто килобайт.
      var ads = document.createElement('script');
      ads.src = 'https://yandex.ru/ads/system/context.js';
      ads.async = true;
      document.head.appendChild(ads);
    });
  </script>

  <script>console.log("Upgrader, сборка 20260907-051416");</script>
  <script src="flutter_bootstrap.js?v=20260907-051416" async></script>
</body>
</html>
